server:
  port: 8083

spring:
  application:
    name: comercial-service

  datasource:
    url: jdbc:mysql://localhost:3306/comercial_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456789
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

eureka:
  client:
    enabled: false