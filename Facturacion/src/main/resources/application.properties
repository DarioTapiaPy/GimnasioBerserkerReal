server.port=8084
spring.application.name=facturacion-service

# Configuración de Base de Datos (Sin contraseña para XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/facturacion_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA y Flyway
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Desactivar Eureka para evitar errores rojos en consola
eureka.client.enabled=false

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true