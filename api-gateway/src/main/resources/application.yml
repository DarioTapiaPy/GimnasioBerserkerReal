server:
  port: 8090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # ── Rutas dedicadas para api-docs (DEBEN ir ANTES de las rutas generales) ──
        # Sin estas rutas, el gateway reenviaría /api/socios/v3/api-docs
        # a socios-service:8082/api/socios/v3/api-docs (404), en vez de
        # a socios-service:8082/v3/api-docs (correcto).

        - id: rutina-service-apidocs
          uri: http://rutina-service:8086
          predicates:
            - Path=/api/rutinas/v3/api-docs
          filters:
            - RewritePath=/api/rutinas/v3/api-docs, /v3/api-docs

        - id: socios-service-apidocs
          uri: http://socios-service:8082
          predicates:
            - Path=/api/socios/v3/api-docs
          filters:
            - RewritePath=/api/socios/v3/api-docs, /v3/api-docs

        - id: empleados-service-apidocs
          uri: http://empleados-service:8081
          predicates:
            - Path=/api/empleados/v3/api-docs
          filters:
            - RewritePath=/api/empleados/v3/api-docs, /v3/api-docs

        # ── Rutas generales de cada microservicio ──────────────────────────────

        # 1. RUTA DE RUTINAS
        - id: rutina-service
          uri: http://rutina-service:8086
          predicates:
            - Path=/api/rutinas/**

        # 2. RUTA DE SOCIOS
        - id: socios-service
          uri: http://socios-service:8082
          predicates:
            - Path=/api/socios/**

        # 3. RUTA DE EMPLEADOS
        - id: empleados-service
          uri: http://empleados-service:8081
          predicates:
            - Path=/api/empleados/**

        # 4. OTRAS RUTAS (Facturacion, Inventario, Comercial)
        - id: facturacion-service
          uri: http://facturacion-service:8084
          predicates:
            - Path=/api/facturacion/**
        - id: comercial-service
          uri: http://comercial-service:8083
          predicates:
            - Path=/api/comercial/**
        - id: inventario-service
          uri: http://inventario-service:8085
          predicates:
            - Path=/api/inventario/**

eureka:
  client:
    enabled: false


springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: Rutinas
        url: /api/rutinas/v3/api-docs
      - name: Socios
        url: /api/socios/v3/api-docs
      - name: Empleados
        url: /api/empleados/v3/api-docs
