# ═══════════════════════════════════════════════════════════
#  Rutina · application.yml
#  Puerto: 8086  |  BD: rutina_db  |  Gimnasio Berserker
# ═══════════════════════════════════════════════════════════

server:
  port: 8086

spring:
  application:
    name: rutina-service

  datasource:
    url: jdbc:mysql://localhost:3306/rutina_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

# ── Swagger / OpenAPI ──────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
