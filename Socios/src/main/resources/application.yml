# ═══════════════════════════════════════════════════════════
#  Socios · application.yml
#  Puerto: 8082  |  BD: socios_db  |  Gimnasio Berserker
# ═══════════════════════════════════════════════════════════

server:
  port: 8082

spring:
  application:
    name: Socios

  datasource:
    url: jdbc:mysql://localhost:3306/socios_db?useSSL=false&serverTimezone=UTC
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    enabled: false

rutina:
  service:
    url: http://localhost:8086

# ── Swagger / OpenAPI ──────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  info:
    title: "Socios API - Gimnasio Berserker"
    version: "1.0.0"
