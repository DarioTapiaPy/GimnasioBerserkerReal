# ═══════════════════════════════════════════════════
# Socios · application.properties  (FeignClient)
# Puerto: 8082  |  BD: socios_db
# ═══════════════════════════════════════════════════

server.port=8082
spring.application.name=Socios

spring.datasource.url=jdbc:mysql://localhost:3306/socios_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

eureka.client.enabled=false

rutina.service.url=http://localhost:8086